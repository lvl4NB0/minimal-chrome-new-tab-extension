<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New Tab</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button id="apps-button" class="apps-button" type="button"
            aria-label="Googleアプリ" aria-expanded="false" aria-controls="apps-menu">
      <span class="dot-grid" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </span>
    </button>
    <nav id="apps-menu" class="apps-menu" aria-label="Googleアプリ" hidden>
      <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon gmail">M</span><span>Gmail</span></a>
      <a href="https://drive.google.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon drive">▲</span><span>Drive</span></a>
      <a href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon calendar">31</span><span>Calendar</span></a>
      <a href="https://docs.google.com/document/" target="_blank" rel="noopener noreferrer"><span class="app-icon docs">▤</span><span>ドキュメント</span></a>
      <a href="https://docs.google.com/spreadsheets/" target="_blank" rel="noopener noreferrer"><span class="app-icon sheets">▦</span><span style="font-size: 85%;">スプレッドシート</span></a>
      <a href="https://maps.google.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon maps">🗺</span><span>Maps</span></a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon youtube">▶</span><span>YouTube</span></a>
      <a href="https://photos.google.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon photos">✿</span><span>フォト</span></a>
      <a href="https://translate.google.com/" target="_blank" rel="noopener noreferrer"><span class="app-icon translate">文</span><span>翻訳</span></a>
    </nav>
  </header>

  <main class="page">
    <section class="search-area" aria-label="検索">
      <form id="search-form" action="https://www.google.com/search" method="get" autocomplete="off">
        <label class="visually-hidden" for="search-input">Google検索</label>
        <div class="search-wrap">
          <input id="search-input" name="q" type="search"
                 placeholder="Google検索またはURLを入力" autocomplete="off"
                 spellcheck="false" autofocus aria-autocomplete="list"
                 aria-controls="suggestions" aria-expanded="false">
          <ul id="suggestions" class="suggestions" role="listbox" aria-label="検索候補" hidden></ul>
        </div>
      </form>
    </section>

    <section id="extras" class="extras" aria-label="Todoとカウントダウン" hidden>
      <section class="panel">
        <h2>カウントダウン</h2>
        <form id="target-form" class="entry-form">
          <input id="target-title" type="text" maxlength="120" placeholder="予定名" required>
          <input id="target-date" type="datetime-local" required>
          <button type="submit">追加</button>
        </form>
        <ul id="target-list" class="item-list"></ul>
      </section>

      <section class="panel">
        <h2>Todo</h2>
        <form id="todo-form" class="entry-form">
          <input id="todo-title" type="text" maxlength="200" placeholder="やることを入力" required>
          <button type="submit">追加</button>
        </form>
        <ul id="todo-list" class="item-list"></ul>
      </section>
    </section>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section class="panel" >
      <input type="file" id="file-input" accept=".json" />
      <label for="file-input" id="user-data-input">ユーザーデータを引き継ぐ</label>
      <input type="checkbox" checked id="backup-check" />
      <label for="backup-check">バックアップを保存する</label>
    </section>
  </main>
</body>
</html>
